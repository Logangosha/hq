# Work Item runner — the one real copy. Every domain repo (HQ included) has a small
# stub, .github/workflows/work-item.yml, that calls this file. Change the workflow
# here and every domain uses it on its next run; the stubs never need updating.
# The stub comes from orchestration/work-item.yml via scripts/enable-agents.sh.
#
# A stage: label lands on an Issue -> the agent for that stage runs -> it comments
# and sets the next stage: label, which starts the next run.
#
# The steps' logic lives in HQ's scripts/runner/, not here. GitHub refuses to let a
# GitHub App push a change to a file under .github/workflows/, so anything written in
# this file is a file the agents can never change (it stopped hq#32 dead). Keep this
# file a thin caller: fetch HQ, then run its scripts.
name: Work Item runner

on:
  workflow_call:
    inputs:
      hq_repo:
        description: owner/repo of the HQ to fetch agents from
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # F8.1: the user's turn -> assign them, so the GitHub app pings their phone.
  # Assigned means "needs you"; the stage job below unassigns when agents take it back.
  notify:
    if: github.event.label.name == 'stage:review' || github.event.label.name == 'waiting:user'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-assignee "$GITHUB_REPOSITORY_OWNER"

  stage:
    # Only stage: labels. stage:review is the user's turn, so no agent runs.
    # waiting:* means the Work Item is parked.
    if: >-
      startsWith(github.event.label.name, 'stage:')
      && github.event.label.name != 'stage:review'
      && !contains(toJSON(github.event.issue.labels.*.name), 'waiting:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch HQ
        run: git clone --depth 1 https://github.com/${{ inputs.hq_repo }}.git .hq

      - name: Back to the agents, so no longer the user's turn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: bash .hq/scripts/runner/assign.sh remove

      - name: Install HQ's agents
        run: bash .hq/scripts/runner/install-agents.sh

      - name: Which agent
        id: agent
        env:
          LABEL: ${{ github.event.label.name }}
        run: bash .hq/scripts/runner/which-agent.sh

      - name: Three strikes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          NAME: ${{ steps.agent.outputs.name }}
        run: bash .hq/scripts/runner/three-strikes.sh

      - name: The agent's briefing
        id: prompt
        env:
          NUM: ${{ github.event.issue.number }}
          NAME: ${{ steps.agent.outputs.name }}
          LABEL: ${{ github.event.label.name }}
          REPO: ${{ github.repository }}
        run: bash .hq/scripts/runner/prompt.sh

      - uses: anthropics/claude-code-action@v1
        id: run_agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Each stage is started by the previous stage's label change, which the
          # claude bot makes. Without this the chain stops after stage 1.
          allowed_bots: "claude"
          # bypassPermissions: no one is here to approve prompts, and without it writes
          # to .claude/ (skills, agents) are always refused. The runner is thrown away
          # after the run; everything still reaches main only through a reviewed PR.
          claude_args: '--permission-mode bypassPermissions --allowedTools "Bash,Read,Write,Edit,Glob,Grep" --max-turns ${{ steps.agent.outputs.max_turns }}'
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Report a failed agent step
        if: failure() && steps.run_agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          NAME: ${{ steps.agent.outputs.name }}
          LABEL: ${{ github.event.label.name }}
        run: bash .hq/scripts/runner/report-failure.sh
