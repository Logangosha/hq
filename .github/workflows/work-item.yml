# Work Item stub. Installed into each domain repo as .github/workflows/work-item.yml
# by scripts/enable-agents.sh, which fills in Logangosha/hq and main.
# It only hands the event to HQ's runner, so it never needs updating:
# change .github/workflows/work-item-runner.yml in HQ instead.
name: Work Item

on:
  issues:
    types: [labeled]

concurrency:
  group: work-item-${{ github.event.issue.number }}
  cancel-in-progress: false

# The most the runner's jobs may use; each job asks for what it needs.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  run:
    uses: Logangosha/hq/.github/workflows/work-item-runner.yml@main
    with:
      hq_repo: Logangosha/hq
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
