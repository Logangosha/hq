<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ Dashboard</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #e4e2dc; --accent: #c2410c; --accent-soft: #fdeee6;
    --ok: #15803d; --chip: #efede8;
    --add-bg: #e7f6ec; --add: #116329; --del-bg: #fdecec; --del: #a4161a; --hunk: #6b6a66;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --surface: #1f1f1c; --text: #ecebe6; --muted: #9c9a93;
      --line: #33322e; --accent: #fb923c; --accent-soft: #3a2518;
      --ok: #4ade80; --chip: #2a2926;
      --add-bg: #13301d; --add: #86efac; --del-bg: #3b1616; --del: #fca5a5; --hunk: #9c9a93;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  #updated { color: var(--muted); font-size: 13px; margin-left: auto; }
  button {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 28px 0 10px; font-weight: 600;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center;
  }
  .needs .card { border-left: 3px solid var(--accent); }
  .ref { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .title { flex: 1; min-width: 0; }
  .title a { color: var(--text); text-decoration: none; font-weight: 500; }
  .title a:hover { text-decoration: underline; }
  .why { display: block; font-size: 13px; color: var(--accent); margin-top: 2px; }
  .blocked-by { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chip {
    font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    background: var(--chip); color: var(--muted);
  }
  .needs .chip { background: var(--accent-soft); color: var(--accent); }
  .repo { font-weight: 600; margin: 18px 0 8px; font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; padding: 4px 0 8px; }
  .all-clear { color: var(--ok); }
  .error, .warn {
    background: var(--accent-soft); color: var(--accent); border-radius: 10px;
    padding: 12px 14px; white-space: pre-wrap; font-size: 14px; margin-bottom: 12px;
  }
  .refusal {
    background: var(--surface); border: 1px dashed var(--accent); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px;
  }
  .refusal::before { content: "⚠ GitHub isn't answering — "; color: var(--accent); font-weight: 600; }

  /* Review view */
  .back { margin-bottom: 16px; }
  .review-title { font-size: 20px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 18px; }
  .meta a { color: var(--accent); }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .panel pre { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--mono); }
  .app-link { font-weight: 600; color: var(--accent); }
  details.file {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 10px; overflow: hidden;
  }
  details.file summary {
    padding: 8px 12px; cursor: pointer; font: 13px var(--mono);
    border-bottom: 1px solid var(--line); display: flex; gap: 10px;
  }
  details.file summary .n { margin-left: auto; color: var(--muted); }
  .diff { overflow-x: auto; font: 12.5px/1.5 var(--mono); }
  .diff div { white-space: pre; padding: 0 12px; min-width: max-content; }
  .diff .add { background: var(--add-bg); color: var(--add); }
  .diff .del { background: var(--del-bg); color: var(--del); }
  .diff .hunk { color: var(--hunk); background: var(--chip); }
  .spinner { color: var(--muted); padding: 24px 0; }
  .done { color: var(--ok); font-weight: 500; margin-bottom: 16px; }
  .decide {
    position: sticky; bottom: 0; margin: 20px -16px -60px; padding: 12px 16px 16px;
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .decide textarea {
    width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text);
  }
  .decide select {
    font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .decide .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .decide .hint { color: var(--muted); font-size: 13px; margin-right: auto; }
  button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.reject { color: var(--accent); border-color: var(--accent); }
  @media (prefers-color-scheme: dark) { button.approve { color: #0b1f12; } }

  #budget, #version { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #budget.low { color: var(--warn, #b45309); font-weight: 600; }

  @media (max-width: 520px) {
    .card { flex-wrap: wrap; }
    .chip { order: 3; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>HQ</h1>
    <span id="branch" class="chip"></span>
    <span id="updated">Loading…</span>
    <span id="budget" title="GitHub calls used this hour"></span>
    <span id="version" title="Code currently being served">{{HQ_VERSION}}</span>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <div id="content"></div>
</main>
<script>
  const content = document.getElementById("content");
  const updated = document.getElementById("updated");
  const budget = document.getElementById("budget");

  // GitHub's own count, which rides along on the response we already made.
  function showBudget(header) {
    if (!header) return;
    const [remaining, limit, reset] = header.split(",").map(Number);
    const used = limit - remaining;
    const mins = Math.max(0, Math.round((reset * 1000 - Date.now()) / 60000));
    budget.textContent = `${used.toLocaleString()}/${limit.toLocaleString()} calls · resets in ${mins}m`;
    budget.classList.toggle("low", remaining < limit * 0.1);
  }
  const refresh = document.getElementById("refresh");
  let domains = [];
  let current = null;  // the Work Item being reviewed: {repo, number}
  let timer = null;
  let pingTimer = null;  // keeps the running app instance's heartbeat fresh
  let idleTimer = null;
  let paused = null;  // null, "hidden" (tab not visible), or "idle" (no activity)
  const IDLE_MS = 5 * 60 * 1000;

  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // WCAG relative luminance of a "rrggbb" hex colour, then the text colour (black or
  // white) with the higher contrast ratio against it — works for any background, so
  // no stage-name -> colour table is needed here.
  function readableTextColor(hex) {
    const c = hex.match(/.{2}/g).map(h => {
      const v = parseInt(h, 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    const luminance = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    const contrastWith = white => (Math.max(luminance, white) + 0.05) / (Math.min(luminance, white) + 0.05);
    return contrastWith(1) > contrastWith(0) ? "#ffffff" : "#000000";
  }

  fetch("/api/branch").then(r => r.json()).then(d => {
    if (d.branch) document.getElementById("branch").textContent = d.branch;
  }).catch(() => {});

  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-HQ": "1" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  // ---- List ----

  function card(d, it, showWhy) {
    const canReview = it.stage.startsWith("6 ");
    const canAnswer = it.waiting.includes("waiting:user");
    const canRestart = it.stalled && !canAnswer;
    const why = !showWhy ? "" :
      canAnswer ? "An agent stopped and needs your answer"
      : canReview ? "Ready for your review"
      : canRestart ? it.stall_reason
      : "";
    return `<div class="card">
      <span class="ref">${esc(d.repo)}#${it.number}</span>
      <span class="title"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
        ${why ? `<span class="why">${esc(why)}</span>` : ""}
        ${it.blocked_by ? `<span class="blocked-by">Waiting on ${esc(it.blocked_by)}</span>` : ""}</span>
      <span class="chip"${it.stage_color ? ` style="background:#${esc(it.stage_color)};color:${readableTextColor(it.stage_color)}"` : ""}>${esc(it.stage.replace(/^\d+ /, ""))}</span>
      ${canReview ? `<button class="primary" data-review="${esc(d.full)}" data-number="${it.number}">Review</button>` : ""}
      ${canAnswer ? `<button class="primary" data-answer="${esc(d.full)}" data-number="${it.number}">Answer</button>` : ""}
      ${canRestart ? `<button data-restart="${esc(d.full)}" data-number="${it.number}">Restart</button>` : ""}
    </div>`;
  }

  function renderList() {
    const needs = domains.flatMap(d => d.items.filter(i => i.needs_you).map(i => card(d, i, true)));
    let html = `<h2>Needs you</h2><section class="needs">` +
      (needs.length ? needs.join("") : `<div class="empty all-clear">Nothing needs you right now.</div>`) +
      `</section><h2>In progress</h2>`;
    for (const d of domains) {
      const rest = d.items.filter(i => !i.needs_you);
      html += `<div class="repo">${esc(d.full)}</div>` +
        (rest.length ? rest.map(i => card(d, i, false)).join("") : `<div class="empty">No Work Items in progress.</div>`);
    }
    content.innerHTML = html;
  }

  function nextDelay() {
    const items = domains.flatMap(d => d.items);
    const agentWorking = items.some(i =>
      !i.stage.startsWith("6 ") && !i.waiting.includes("waiting:user") && !i.waiting.includes("waiting:work"));
    return agentWorking ? 5000 : 30000;
  }

  function scheduleRefresh() {
    clearTimeout(timer);
    if (paused) return;  // the tab is hidden or idle: resuming re-arms this
    timer = setTimeout(() => load(true), nextDelay());
  }

  // R3/R4: replaces "Updated <time>" so the last-loaded data is never shown as current.
  function setPaused(reason) {
    paused = reason;
    clearTimeout(timer);
    updated.textContent = reason === "hidden" ? "Paused — tab hidden" : "Paused — idle";
  }

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!document.hidden && !paused) setPaused("idle");
    }, IDLE_MS);
  }

  function onActivity() {
    resetIdleTimer();
    if (paused === "idle") load();  // R6: resume immediately, don't wait for the timer
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      setPaused("hidden");
    } else {
      resetIdleTimer();
      load();  // R5: resume immediately, don't wait for the timer
    }
  });
  ["click", "keydown", "scroll", "pointermove"].forEach(evt =>
    document.addEventListener(evt, onActivity, { passive: true }));

  async function load(auto = false) {
    if (!auto) {
      refresh.disabled = true;
      updated.textContent = "Loading…";
    }
    try {
      const res = await fetch("/api/items");
      showBudget(res.headers.get("X-HQ-Rate"));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      if (data.refusal) {
        if (!current) content.innerHTML = `<div class="refusal">${esc(data.refusal.message)}</div>`;
        updated.textContent = "";
      } else {
        domains = data;
        if (!current) renderList();
        updated.textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
      }
    } catch (e) {
      if (!current) content.innerHTML = `<div class="error">Couldn't load Work Items.\n${esc(e.message)}</div>`;
      updated.textContent = auto ? "Update failed" : "";
    } finally {
      paused = null;  // a completed fetch, however it turned out, is fresh enough to resume on
      refresh.disabled = false;
      scheduleRefresh();
    }
  }

  // ---- Review ----

  function renderDiff(diff) {
    const files = diff.split(/^(?=diff --git )/m).filter(f => f.trim());
    if (!files.length) return `<div class="empty">No code changes.</div>`;
    return files.map(f => {
      const lines = f.split("\n");
      const name = (lines[0].match(/ b\/(.+)$/) || [, lines[0]])[1];
      let adds = 0, dels = 0;
      const body = lines.slice(1)
        .filter(l => !/^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity|rename )/.test(l))
        .map(l => {
          let cls = "";
          if (l.startsWith("@@")) cls = "hunk";
          else if (l.startsWith("+")) { cls = "add"; adds++; }
          else if (l.startsWith("-")) { cls = "del"; dels++; }
          return `<div class="${cls}">${esc(l) || " "}</div>`;
        }).join("");
      return `<details class="file" open><summary><span>${esc(name)}</span>
        <span class="n">+${adds} −${dels}</span></summary><div class="diff">${body}</div></details>`;
    }).join("");
  }

  function appPanel(r) {
    if (!r.has_app) return `No app to start for this repo. Ask Claude in the chat if you want to see it running.`;
    return `App:
      <button id="app-start">Start</button>
      <button id="app-stop" disabled>Stop</button>
      <button id="app-restart" disabled>Restart</button>
      <button id="app-open" disabled>Open</button>
      <span class="chip" id="app-status">Stopped</span>`;
  }

  function wireAppPanel() {
    const start = document.getElementById("app-start");
    const stop = document.getElementById("app-stop");
    const restart = document.getElementById("app-restart");
    const open = document.getElementById("app-open");
    const status = document.getElementById("app-status");

    function setRunning(running) {
      start.disabled = running;
      stop.disabled = !running;
      restart.disabled = !running;
      open.disabled = !running;
      status.textContent = running ? "Running" : "Stopped";
      clearInterval(pingTimer);
      if (running) pingTimer = setInterval(() => post("/api/review/app/ping", current).catch(() => {}), 60000);
    }
    async function run(path, busyText, doneRunning) {
      status.textContent = busyText;
      [start, stop, restart, open].forEach(b => b.disabled = true);
      try { await post(path, current); setRunning(doneRunning); }
      catch (e) { status.textContent = e.message; setRunning(!doneRunning); }
    }
    start.addEventListener("click", () => run("/api/review/app/start", "Starting…", true));
    stop.addEventListener("click", () => run("/api/review/app/stop", "Stopping…", false));
    restart.addEventListener("click", () => run("/api/review/app/restart", "Restarting…", true));
    open.addEventListener("click", () => window.open(
      `/review-window?repo=${encodeURIComponent(current.repo)}&number=${current.number}`, "_blank"));
  }

  function renderReview(r) {
    const warn = r.claude_files.length
      ? `<div class="warn">⚠️ Changes how agents and Claude behave — look closely:\n${r.claude_files.map(esc).join("\n")}</div>` : "";
    content.innerHTML = `
      <button class="back" id="close">← Done reviewing</button>
      <h1 class="review-title">${esc(r.title)}</h1>
      <div class="meta">
        <span>${esc(r.key)}</span>
        <a href="${esc(r.pr_url)}" target="_blank" rel="noopener">Pull request #${esc(r.pr)}</a>
        <span>Branch <code>${esc(r.branch)}</code> is checked out in <code>${esc(r.path)}</code></span>
      </div>
      <div class="panel">${appPanel(r)}</div>
      ${warn}
      ${r.qa ? `<h2>QA</h2><div class="panel"><pre>${esc(r.qa)}</pre></div>` : ""}
      <h2>Code changes</h2>
      ${renderDiff(r.diff)}
      <div class="decide">
        <textarea id="comment" placeholder="What do you think? Required to reject — the agents get your words as-is."></textarea>
        <div class="row">
          <span class="hint" id="hint"></span>
          <button id="drop">Drop it</button>
          <button class="reject" id="reject" disabled>Reject — send back</button>
          <button class="approve" id="approve">Approve &amp; merge</button>
        </div>
      </div>`;
    if (r.has_app) wireAppPanel();
    const comment = document.getElementById("comment");
    const reject = document.getElementById("reject");
    comment.addEventListener("input", () => { reject.disabled = !comment.value.trim(); });
    armed(reject, "Click again to send back", () => decide("reject", comment.value));
    armed(document.getElementById("drop"), "Click again to drop it",
          () => send("/api/drop", { comment: comment.value }, "Dropping…"));
    armed(document.getElementById("approve"), "Click again to merge", () => decide("approve", comment.value));
    document.getElementById("close").addEventListener("click", closeReview);
  }

  // Two clicks instead of confirm(): Claude's browser pane silently answers "Cancel"
  // to every dialog, so a confirm() there blocks the button forever.
  function armed(button, prompt, action) {
    const label = button.textContent;
    let timer = null;
    button.addEventListener("click", () => {
      if (timer) { clearTimeout(timer); timer = null; button.textContent = label; return action(); }
      button.textContent = prompt;
      timer = setTimeout(() => { timer = null; button.textContent = label; }, 4000);
    });
  }

  const decide = (decision, comment) =>
    send("/api/review/decide", { decision, comment },
         decision === "approve" ? "Merging…" : "Sending back…");

  // Every decision ends the same way: lock the panel, send, then back to the list.
  async function send(path, extra, working = "Working…") {
    clearInterval(pingTimer);
    const hint = document.getElementById("hint");
    const panel = () => document.querySelectorAll(".decide button, .decide textarea, .decide select, #close");
    hint.style.color = "";
    hint.textContent = working;
    panel().forEach(el => el.disabled = true);
    try {
      const { message } = await post(path, { ...current, ...extra });
      current = null;
      content.innerHTML = `<div class="spinner">Refreshing…</div>`;
      await load();
      content.insertAdjacentHTML("afterbegin", `<div class="done">✓ ${esc(message)}</div>`);
    } catch (e) {
      hint.textContent = e.message;  // no alert(): dialogs are blocked in the pane too
      hint.style.color = "var(--accent)";
      panel().forEach(el => el.disabled = false);
      const comment = (document.getElementById("comment")?.value || "").trim();
      for (const id of ["reject", "resume"]) {
        const b = document.getElementById(id);
        if (b) b.disabled = !comment;
      }
    }
  }

  // ---- Stopped: answer and restart ----

  async function openStopped(repo, number) {
    current = { repo, number };
    content.innerHTML = `<div class="spinner">Reading the Work Item…</div>`;
    try {
      const s = await post("/api/stopped", current);
      content.innerHTML = `
        <button class="back" id="close">← Back</button>
        <h1 class="review-title">${esc(s.title)}</h1>
        <div class="meta">
          <span>${esc(repo.split("/").pop())}#${number}</span>
          <a href="${esc(s.url)}" target="_blank" rel="noopener">Open the Issue</a>
          <span>An agent stopped here and needs your answer.</span>
        </div>
        <h2>Goal</h2><div class="panel"><pre>${esc(s.goal)}</pre></div>
        <h2>Where it stopped</h2><div class="panel"><pre>${esc(s.last)}</pre></div>
        <div class="decide">
          <textarea id="comment" placeholder="Your answer — what should the agents do?"></textarea>
          <div class="row">
            <span class="hint" id="hint"></span>
            <button class="reject" id="drop">Drop it</button>
            <button class="approve" id="resume" disabled>Send answer &amp; restart</button>
          </div>
        </div>`;
      const comment = document.getElementById("comment");
      const resume = document.getElementById("resume");
      comment.addEventListener("input", () => { resume.disabled = !comment.value.trim(); });
      armed(resume, "Click again to restart", () => send("/api/resume", { comment: comment.value }));
      armed(document.getElementById("drop"), "Click again to drop it",
            () => send("/api/drop", { comment: comment.value }, "Dropping…"));
      document.getElementById("close").addEventListener("click", closeReview);
    } catch (e) {
      content.innerHTML = `<button class="back" id="close">← Back</button><div class="error">${esc(e.message)}</div>`;
      document.getElementById("close").addEventListener("click", closeReview);
    }
  }

  async function openReview(repo, number) {
    current = { repo, number };
    content.innerHTML = `<div class="spinner">Checking out the branch…</div>`;
    try {
      renderReview(await post("/api/review", current));
    } catch (e) {
      content.innerHTML = `<button class="back" id="close">← Back</button><div class="error">${esc(e.message)}</div>`;
      document.getElementById("close").addEventListener("click", closeReview);
    }
  }

  async function closeReview() {
    clearInterval(pingTimer);
    const r = current;
    content.innerHTML = `<div class="spinner">Stopping the app and putting your copy back…</div>`;
    try { await post("/api/review/close", r); } catch (e) { /* nothing was checked out */ }
    current = null;
    await load();
  }

  // Reads the item straight from the already-loaded list — same data the card renders
  // from, so opening the panel costs no extra call.
  async function openRestart(repo, number) {
    current = { repo, number };
    const d = domains.find(d => d.full === repo);
    const it = d && d.items.find(i => i.number === number);
    content.innerHTML = `
      <button class="back" id="close">← Back</button>
      <h1 class="review-title">${esc(it ? it.title : `${repo}#${number}`)}</h1>
      <div class="meta">
        <span>${esc(repo.split("/").pop())}#${number}</span>
        ${it ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">Open the Issue</a>` : ""}
        <span>${esc((it && it.stall_reason) || "")}</span>
      </div>
      <div class="decide">
        <textarea id="reason" placeholder="Why are you restarting it?"></textarea>
        <div class="row">
          <select id="target">
            <option value="">Same stage${it ? ` (${esc(it.stage.replace(/^\d+ /, ""))})` : ""}</option>
            <option value="requirements">1 Requirements</option>
            <option value="verification">2 Verification</option>
            <option value="plan">3 Plan</option>
            <option value="build">4 Build</option>
            <option value="qa">5 QA</option>
          </select>
          <span class="hint" id="hint"></span>
          <button class="approve" id="go" disabled>Restart</button>
        </div>
      </div>`;
    const reason = document.getElementById("reason");
    const target = document.getElementById("target");
    const go = document.getElementById("go");
    reason.addEventListener("input", () => { go.disabled = !reason.value.trim(); });
    armed(go, "Click again to restart",
          () => send("/api/restart", { reason: reason.value, stage: target.value || null }));
    document.getElementById("close").addEventListener("click", closeReview);
  }

  content.addEventListener("click", e => {
    const b = e.target.closest("[data-review]");
    if (b) return openReview(b.dataset.review, Number(b.dataset.number));
    const a = e.target.closest("[data-answer]");
    if (a) return openStopped(a.dataset.answer, Number(a.dataset.number));
    const r = e.target.closest("[data-restart]");
    if (r) return openRestart(r.dataset.restart, Number(r.dataset.number));
  });
  refresh.addEventListener("click", () => load());
  resetIdleTimer();
  load();
</script>
</body>
</html>
