<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
  :root {
    --bg: #f7f7f6; --surface: #ffffff; --text: #1c1c1b; --muted: #6a6a66;
    --line: #e3e3e0; --hover: #efefed; --chip: #ecece9;
    --accent: #c2410c; --accent-soft: #fbeae1;
    --add-bg: #f0f0ee; --del-bg: #e2e2df;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --surface: #1d1d1b; --text: #ecece8; --muted: #9a9a94;
      --line: #32322f; --hover: #2a2a27; --chip: #2a2a27;
      --accent: #fb923c; --accent-soft: #3a2518;
      --add-bg: #262624; --del-bg: #333331;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans);
    min-height: 100vh; display: flex; flex-direction: column; }
  .ms {
    font-family: "Material Symbols Outlined"; font-weight: 400; font-style: normal;
    font-size: 20px; line-height: 1; display: inline-block; width: 1em; height: 1em;
    overflow: hidden; white-space: nowrap; letter-spacing: normal; text-transform: none;
    vertical-align: middle; flex: none; user-select: none;
  }
  .mono, .meta { font-family: var(--mono); }
  .muted { color: var(--muted); }
  a { color: inherit; }
  button {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { background: var(--hover); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.primary:hover { opacity: 0.88; background: var(--text); }
  button.ghost { border-color: transparent; background: transparent; padding: 4px 6px; }
  button.ghost:hover { background: var(--hover); }

  /* top bar */
  #top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .topbar .name { font-weight: 600; font-size: 17px; padding: 4px 8px; border-color: transparent; background: transparent; }
  .topbar .name:hover { background: var(--hover); }
  .topbar .spacer { flex: 1; }
  .topbar .repo { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .ready { color: var(--accent); }
  .topbar .switch { font-size: 13px; }
  .dropdown { max-width: 860px; margin: 0 auto; padding: 0 16px 10px; }
  .dropdown .opt {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
    border-radius: 8px; cursor: pointer;
  }
  .dropdown .opt:hover { background: var(--hover); }
  .dropdown .opt .n { margin-left: auto; font-size: 13px; }
  .dropdown .opt.current { font-weight: 600; }

  main { max-width: 860px; width: 100%; margin: 0 auto; padding: 18px 16px 40px; flex: 1; display: flex; flex-direction: column; }
  /* detail pages fill the window so the action bar sits at its bottom even when content is short */
  #page:has(> .bar) { flex: 1; display: flex; flex-direction: column; }
  #page:has(> .bar) > .back { align-self: flex-start; }
  .barspace { flex: 1; min-height: 20px; }

  /* system line */
  .sys {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-bottom: 16px;
    font: 12px var(--mono); color: var(--muted);
  }
  .sys[hidden] { display: none; }
  .sys button { font-size: 12px; padding: 2px 8px; }

  /* groups and sections */
  .grp { margin-bottom: 14px; }
  .grp-h {
    display: flex; align-items: center; gap: 8px; padding: 10px 6px; cursor: pointer;
    font-weight: 600; border-radius: 8px;
  }
  .grp-h:hover { background: var(--hover); }
  .grp-h .sum { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); }
  .grp-b { display: none; }
  .grp.open > .grp-b { display: block; }
  .chev { transition: transform 0.12s; }
  .open > .grp-h .chev, .open > .sec-h .chev { transform: rotate(180deg); }
  .sec { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
  .sec-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; border-radius: 10px; }
  .sec-h:hover { background: var(--hover); }
  .sec-h .t { font-weight: 500; }
  .count { font: 12px var(--mono); padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .count.ready { background: var(--accent-soft); color: var(--accent); }
  .sec-h .extra { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .sec-b { display: none; padding: 4px 8px 10px; border-top: 1px solid var(--line); }
  .sec.open > .sec-b { display: block; }
  .sec-b pre { margin: 6px 4px; white-space: pre-wrap; font: 13px/1.5 var(--mono); }
  .viewpanel {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 8px 12px;
    border-top: 1px solid var(--line); font-size: 13px; background: var(--bg);
  }
  .viewpanel select {
    font: inherit; font-size: 13px; padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 6px; }
  .pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 8px 6px 0; font: 12px var(--mono); color: var(--muted); }

  /* rows */
  .row {
    display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 8px;
    cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row + .row { border-top: 1px solid var(--line); }
  .row.part { margin-left: 28px; }
  .row .lead { color: var(--muted); display: flex; width: 20px; justify-content: center; }
  .row.isready .lead { color: var(--accent); }
  .row .mid { flex: 1; min-width: 0; }
  .row .ttl { font-weight: 500; }
  .row .tags { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 3px; font: 12px var(--mono); color: var(--muted); }
  .tag { padding: 0 7px; border-radius: 999px; background: var(--chip); }
  .row .verb { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .row.isready .verb { color: var(--accent); font-weight: 500; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dash { width: 16px; height: 16px; border-radius: 50%; border: 2px dashed var(--muted); display: inline-block; }

  /* detail */
  .back { margin-bottom: 14px; }
  .kind { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
  .kind .status { text-transform: none; letter-spacing: 0; margin-left: 8px; }
  h1 { font-size: 22px; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .meta a { text-decoration: underline; }
  .warn, .error, .refusal, .done {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
    background: var(--surface); white-space: pre-wrap; font-size: 14px;
  }
  .warn, .error, .refusal { border-color: var(--text); }
  .done { font-weight: 500; }
  .bar {
    position: sticky; bottom: 0; margin: 0 -16px -40px; padding: 12px 16px 16px;
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .bar textarea {
    width: 100%; min-height: 60px; resize: vertical; font: inherit; font-size: 14px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text);
  }
  .bar select {
    font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .bar .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .bar .hint { color: var(--muted); font-size: 13px; margin-right: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 10px 5px 4px; }
  th { color: var(--muted); font-weight: 500; }
  .step { display: flex; align-items: center; gap: 10px; padding: 7px 4px; }
  .step + .step { border-top: 1px solid var(--line); }
  .step .nm { flex: 1; }
  .step .det { font: 12px var(--mono); color: var(--muted); }
  details.file { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; overflow: hidden; }
  details.file summary { padding: 6px 10px; cursor: pointer; font: 13px var(--mono); display: flex; gap: 10px; }
  details.file summary .n { margin-left: auto; color: var(--muted); }
  .diff { overflow-x: auto; font: 12.5px/1.5 var(--mono); border-top: 1px solid var(--line); }
  .diff div { white-space: pre; padding: 0 10px; min-width: max-content; }
  .diff .add { background: var(--add-bg); }
  .diff .del { background: var(--del-bg); }
  .diff .hunk { color: var(--muted); }
  .appbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 4px; }
  .spinner { color: var(--muted); padding: 24px 0; }
  /* result blocks (orchestration/blocks.md) */
  .blk { margin: 8px 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 14px; }
  .blk-ttl { font-weight: 600; margin-bottom: 6px; }
  .blk-note { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .blk p { margin: 0; white-space: pre-wrap; }
  .blk ul, .blk ol { margin: 0; padding-left: 22px; }
  .blk-stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .blk-stat .v { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .blk-stat .u { font-size: 14px; color: var(--muted); margin-left: 4px; }
  .blk-stat .l { font-size: 13px; color: var(--muted); }
  .blk table { font-size: 13px; }
  .blk tr + tr td { border-top: 1px solid var(--line); }
  .blk td.k { color: var(--muted); padding-right: 16px; white-space: nowrap; }
  .blk-svg { display: block; width: 100%; max-width: 480px; height: auto; }
  .blk-svg .mk { fill: var(--accent); }
  .blk-svg .ln { fill: none; stroke: var(--accent); stroke-width: 2; }
  .blk-svg .ax { stroke: var(--muted); stroke-width: 1; }
  .blk-svg text { fill: var(--muted); font: 11px var(--sans); text-anchor: middle; }
  .blk-svg text.val { fill: var(--text); }
  .blk-file .p { font: 13px var(--mono); }
  .blk-callout { border-left: 4px solid var(--muted); }
  .blk-callout.warning { border-left-color: var(--accent); }
  .blk-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .blk-item .st { font: 12px var(--mono); color: var(--muted); }
  .blk-item .fail { font-weight: 600; color: var(--accent); }
  .blk-item.todo { color: var(--muted); }
  .blk-image img { max-width: 100%; height: auto; border-radius: 6px; display: block; }
  .blk-source blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); }
  .blk-source .from { color: var(--muted); font-size: 13px; margin-top: 4px; }
  /* agents, workflows, history */
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 4px; background: var(--surface); }
  .card-h { display: flex; align-items: center; gap: 8px; }
  .card-h .tag { margin-left: auto; color: var(--muted); font-size: 12px; }
  .card .cname { font-weight: 600; padding: 2px 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .chip { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .chip button, .split .half { border: 0; border-radius: 0; background: transparent; }
  .chip button { padding: 3px 10px; font-size: 13px; }
  .chip button.r { border-left: 1px solid var(--line); }
  .itile { width: 32px; height: 32px; border-radius: 8px; background: var(--chip); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .pill { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .pill.on { background: var(--hover); }
  .cpanel { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 8px 0 2px; font-size: 13px; position: relative; }
  .cpanel table { border-collapse: collapse; }
  .cpanel td { padding: 2px 10px 2px 0; vertical-align: top; }
  .cpanel td:first-child { color: var(--muted); white-space: nowrap; }
  .cpanel code { font-family: ui-monospace, monospace; }
  .solo-h { display: flex; align-items: center; gap: 6px; width: 100%; background: transparent; border: 0; padding: 8px 4px; margin-top: 8px; text-align: left; }
  .solo-h .chev { transition: transform .15s; }
  .solo-h.open .chev { transform: rotate(90deg); }
  .srow { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 14px; cursor: pointer; border-radius: 8px; }
  .srow:hover { background: var(--hover); }
  .srow .tag { margin-left: auto; color: var(--muted); font-size: 12px; }
  .fchip { display: inline-flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; border-radius: 999px; background: var(--surface); font-size: 13px; }
  .fchip .sz { color: var(--muted); font-size: 12px; }
  .askbox { margin-top: 8px; border: 0; border-radius: 18px; padding: 6px 8px; background: var(--chip); }
  .askbox.dragging { outline: 2px dashed var(--line); }
  .askbox .chips { margin: 0 0 6px; }
  .askrow { display: flex; align-items: flex-end; gap: 6px; }
  .askrow textarea, .needs input, .viewpanel input[type=search], .bar .barin {
    font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); }
  .askrow textarea { flex: 1; resize: none; min-height: 34px; max-height: 200px; border: 0; background: transparent; outline: none; }
  .askrow .send { background: transparent; border: 0; color: var(--muted); padding: 6px; }
  .askrow .send.has { color: var(--text); }
  .askrow .send:disabled { opacity: 1; }
  .berr { color: var(--accent); font-size: 13px; padding: 4px 6px; white-space: pre-wrap; }
  .needs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin: 8px 0 2px; }
  .needs label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  .wrow { padding: 4px 4px; }
  .wrow + .wrow { border-top: 1px solid var(--line); }
  .split { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .split .half { padding: 8px 12px; }
  .split .half.l { flex: 1; text-align: left; gap: 10px; }
  .split .half.r { border-left: 1px solid var(--line); }
  .split .mid { display: flex; flex-direction: column; flex: 1; }
  .werr { padding: 4px 6px; }
  .bar .barin { min-width: 160px; }
  .viewpanel input[type=search] { min-width: 180px; }
  .blk-raw { margin: 6px 4px; white-space: pre-wrap; font: 13px/1.5 var(--mono); }
</style>
</head>
<body>
<div id="top"></div>
<main>
  <div id="sys" class="sys" hidden></div>
  <div id="page"></div>
</main>
<script>
  const pageEl = document.getElementById("page");
  const topEl = document.getElementById("top");
  const sysEl = document.getElementById("sys");

  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const icon = (name, cls = "") => `<span class="ms ${cls}">${name}</span>`;

  // Cost/token fields are either a number or a literal "no data"/"unknown" string.
  const fmt = v => typeof v === "number" ? v.toLocaleString() : v;
  const costLabel = c => typeof c === "number" ? "$" + c.toFixed(2) : c;
  function abbrev(v) {
    if (typeof v !== "number") return v;
    if (v >= 1e6) return (v / 1e6).toFixed(1) + "M";
    if (v >= 1e3) return (v / 1e3).toFixed(1) + "K";
    return String(v);
  }
  const short = full => full.split("/").pop();
  const stageName = s => s.replace(/^\d+ /, "");

  // ---- State ----
  let domains = [];
  let totals = [];
  let loadError = null;   // {refusal: bool, message}
  let loaded = false;
  let banner = "";
  let view = { page: "hq" };  // page: hq | domain | about | review | answer | run | result
  let current = null;         // {repo, number} for the open detail page's actions
  // Items just acted on, hidden from lists while GitHub still reports them as waiting on you.
  const acted = new Map();    // `${full}#${number}` -> time acted
  const ACTED_MS = 60000;
  const actedKey = x => `${x.full}#${x.number}`;
  const isHidden = x => x.needs_you && Date.now() - (acted.get(actedKey(x)) || 0) < ACTED_MS;
  let pingTimer = null;
  let timer = null, idleTimer = null;
  let paused = null;
  let statusText = "Loading…";
  let branch = "";
  let budgetText = "";
  let hqOutcome = sessionStorage.getItem("hq-restart-outcome") || "";
  sessionStorage.removeItem("hq-restart-outcome");
  const IDLE_MS = 5 * 60 * 1000;

  const openGroups = new Set();          // group ids that are unfolded
  const openSec = {};                    // list group -> open section id
  const pageIdx = {};                    // section id -> page number
  const viewOpts = {};                   // section id -> {domain, sort}
  const viewOpen = new Set();            // section ids whose view panel is showing
  let dropOpen = false;
  const foldedParents = new Set(JSON.parse(localStorage.getItem("hq-v2-folded-parents") || "[]"));
  const saveFolded = () => localStorage.setItem("hq-v2-folded-parents", JSON.stringify([...foldedParents]));

  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-HQ": "1" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  // ---- Data helpers ----
  const hqDomain = () => domains.find(d => d.repo === "hq");
  const hqFull = () => (hqDomain() || {}).full;
  const nonHq = () => domains.filter(d => d.repo !== "hq");

  // Every non-parent item with the `full`/`repo` it lives in.
  // Flow items and agent runs not yet in History, as rows like Work Items. Runs only on their own page.
  function extraRows(d, withRuns) {
    const base = x => ({ full: d.full, repo: d.repo, number: x.number, title: x.title, url: x.url,
      created_at: x.created_at, blocked_by: [], needs_you: x.state === "ready" });
    const out = (d.flows || []).filter(f => f.state !== "history").map(f => Object.assign(base(f),
      { kind: "flow", stage: f.step || "flow", waiting: f.waiting, workflow: f.workflow, step: f.step, gate: f.gate }));
    if (withRuns) out.push(...(d.runs || []).filter(r => r.state !== "history").map(r => Object.assign(base(r),
      { kind: "run", stage: "Run", waiting: [], agent: r.agent, failed: r.failed })));
    return out;
  }

  function allItems(withRuns = false) {
    return rawItems(withRuns).filter(x => !isHidden(x));
  }

  function rawItems(withRuns = false) {
    const all = [];
    for (const d of domains) {
      all.push(...extraRows(d, withRuns));
      for (const it of d.items) {
        if (it.parent) all.push(...it.parts);
        else all.push(Object.assign({}, it, { full: it.full || d.full, repo: it.repo || d.repo }));
      }
    }
    return all;
  }

  // Top-level rows for the items passing `pred`: standalone items, and parents
  // carrying only the parts that pass.
  function entries(pred0, withRuns = false) {
    const pred = x => !isHidden(x) && pred0(x);
    const out = [];
    for (const d of domains) {
      for (const x of extraRows(d, withRuns)) if (pred(x)) out.push({ item: x, created: x.created_at || "", repo: x.repo });
      for (const it of d.items) {
        if (it.parent) {
          const parts = it.parts.filter(pred);
          if (parts.length) out.push({ parent: it, d, parts, created: parts.map(p => p.created_at || "").sort().pop(), repo: d.repo });
        } else {
          const x = Object.assign({}, it, { full: it.full || d.full, repo: it.repo || d.repo });
          if (pred(x)) out.push({ item: x, created: x.created_at || "", repo: x.repo });
        }
      }
    }
    return out;
  }
  const workCount = es => es.reduce((n, e) => n + (e.item ? 1 : e.parts.length), 0);

  const isReady = x => !!x.needs_you;
  const isWorking = x => x.kind ? !x.needs_you : !x.stage.startsWith("6 ") && !x.waiting.includes("waiting:user")
    && !x.waiting.includes("waiting:work") && !x.waiting.includes("waiting:stopped");

  function verbOf(x) {
    if (x.kind === "run") return x.needs_you ? "Read" : "Watch";
    if (x.kind === "flow") return x.needs_you ? "Decide" : "Watch";
    if (x.stage.startsWith("6 ")) return "Review";
    if (x.waiting.includes("waiting:user")) return "Answer";
    if (x.stalled) return "Retry";
    return "Watch";
  }

  function applyView(es, id) {
    const o = viewOpts[id] || {};
    let out = es;
    if (o.domain) {
      out = out.map(e => e.item ? e : Object.assign({}, e, { parts: e.parts.filter(p => p.full === o.domain) }))
        .filter(e => e.item ? e.item.full === o.domain : e.parts.length);
    }
    const sort = o.sort || "newest";
    const byNew = (a, b) => (a.created < b.created ? 1 : a.created > b.created ? -1 : 0);
    out = out.slice().sort(sort === "oldest" ? (a, b) => -byNew(a, b)
      : sort === "domain" ? (a, b) => a.repo.localeCompare(b.repo) || byNew(a, b) : byNew);
    return out;
  }

  // ---- Rows ----
  function leadIcon(x, verb) {
    if (verb === "Read") return icon(x.failed ? "error" : "description");
    if (verb === "Decide") return icon("rate_review");
    if (verb === "Review") return icon("rate_review");
    if (verb === "Answer") return icon("help");
    if (verb === "Retry") return icon("error");
    if (x.waiting.length || x.stage.startsWith("0 ")) return `<span class="dash"></span>`;
    return isWorking(x) ? icon("progress_activity", "spin") : `<span class="dash"></span>`;
  }

  function itemRow(x, part) {
    const verb = verbOf(x);
    const blocked = x.blocked_by && x.blocked_by.length
      ? `<span>Waiting on ${x.blocked_by.map(b => esc(`${b.ref} (${b.state})`)).join(", ")}</span>` : "";
    return `<div class="row ${isReady(x) ? "isready" : ""} ${part ? "part" : ""}" role="button" tabindex="0"
        data-act="${x.kind ? x.kind + "item" : verb.toLowerCase()}" data-repo="${esc(x.full)}" data-number="${x.number}">
      <span class="lead">${leadIcon(x, verb)}</span>
      <span class="mid"><span class="ttl">${esc(x.title)}</span>
        <span class="tags"><span>${esc(x.repo)}#${x.number}</span><span class="tag">${esc(x.repo)}</span>
          ${x.kind === "run" ? `<span class="tag">${esc(x.agent)}</span>${x.failed ? `<span class="tag">failed</span>` : ""}`
            : x.kind === "flow" ? `<span class="tag">${esc(x.workflow)}</span><span class="tag">${esc(x.step)}</span>`
            : `<span class="tag">${esc(stageName(x.stage))}</span>${x.size === "small" ? `<span class="tag">small</span>` : ""}`}${blocked}</span></span>
      <span class="verb">${verb} ${icon("arrow_forward", "")}</span>
    </div>`;
  }

  function parentRow(e) {
    const p = e.parent, key = `${e.d.full}#${p.number}`, folded = foldedParents.has(key);
    return `<div class="row" role="button" tabindex="0" data-act="parent" data-key="${esc(key)}">
      <span class="lead">${icon(folded ? "chevron_right" : "expand_more")}</span>
      <span class="mid"><span class="ttl">${esc(p.title)}</span>
        <span class="tags"><span>${esc(e.d.repo)}#${p.number}</span><span class="tag">${esc(e.d.repo)}</span>
        <span class="tag">${esc(p.done)} of ${esc(p.total)} done</span></span></span>
      <span class="verb">${folded ? "Unfold" : "Fold"} ${icon(folded ? "unfold_more" : "unfold_less", "")}</span>
    </div>` + (folded ? "" : e.parts.map(x => itemRow(x, true)).join(""));
  }

  function pager(id, total) {
    if (total <= 10) return "";
    const last = Math.ceil(total / 10) - 1;
    const i = Math.min(pageIdx[id] || 0, last);
    return `<div class="pager"><span>${i * 10 + 1}–${Math.min(total, i * 10 + 10)} of ${total}</span>
      <button class="ghost" data-pg="${id}" data-dir="-1" ${i === 0 ? "disabled" : ""}>${icon("chevron_left")}</button>
      <button class="ghost" data-pg="${id}" data-dir="1" ${i === last ? "disabled" : ""}>${icon("chevron_right")}</button></div>`;
  }

  function pageSlice(id, list) {
    const last = Math.max(0, Math.ceil(list.length / 10) - 1);
    const i = Math.min(pageIdx[id] || 0, last);
    return list.length > 10 ? list.slice(i * 10, i * 10 + 10) : list;
  }

  // ---- Sections ----
  function section(group, id, title, count, body, extra = "", opts = {}) {
    const open = openSec[group] === id;
    return `<section class="sec ${open ? "open" : ""}" data-group="${group}" data-id="${id}">
      <div class="sec-h" role="button" tabindex="0" data-toggle="sec">${icon("expand_more", "chev")}
        <span class="t">${esc(title)}</span><span class="count ${opts.ready ? "ready" : ""}">${esc(count)}</span>
        ${extra ? `<span class="extra">${extra}</span>` : ""}</div>
      ${opts.panel || ""}<div class="sec-b">${body}</div></section>`;
  }

  // A Ready-for-you / Running section, with its view control.
  function listSection(group, id, title, pred, ready, withView, runs = false) {
    const all = entries(pred, runs);
    const shown = applyView(all, id);
    const o = viewOpts[id] || {};
    const filtered = !!o.domain || (o.sort && o.sort !== "newest");
    const nShown = workCount(shown), nAll = workCount(all);
    const count = filtered ? `${nShown} of ${nAll}` : String(nAll);
    const rows = pageSlice(id, shown).map(e => e.item ? itemRow(e.item) : parentRow(e)).join("");
    const empty = ready ? "Nothing needs you right now." : "Nothing running.";
    const btn = withView ? `<button class="ghost" data-viewbtn="${id}" title="View options">${icon("tune")}</button>` : "";
    const panel = withView && viewOpen.has(id) ? `<div class="viewpanel">
      <label>Domain <select data-vdomain="${id}"><option value="">All</option>${
        domains.map(d => `<option value="${esc(d.full)}" ${o.domain === d.full ? "selected" : ""}>${esc(d.repo)}</option>`).join("")}</select></label>
      <label>Sort <select data-vsort="${id}">${["newest", "oldest", "domain"].map(s =>
        `<option value="${s}" ${(o.sort || "newest") === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
      <button data-vreset="${id}">Reset</button></div>` : "";
    return section(group, id, title, count,
      (rows || `<div class="empty">${empty}</div>`) + pager(id, shown.length), btn, { ready, panel });
  }

  function group(id, title, summary, inner) {
    return `<div class="grp ${openGroups.has(id) ? "open" : ""}" data-gid="${id}">
      <div class="grp-h" role="button" tabindex="0" data-toggle="grp">${icon("expand_more", "chev")}
        <span>${esc(title)}</span><span class="sum">${esc(summary)}</span></div>
      <div class="grp-b">${inner}</div></div>`;
  }

  function weeklyCosts() {
    const weeks = new Map();
    for (const t of totals) {
      const w = weeks.get(t.week) || { week: t.week, known: 0, hasKnown: false, unknown: 0 };
      if (t.cost == null) w.unknown += t.unknown; else { w.known += t.cost; w.hasKnown = true; w.unknown += t.unknown; }
      weeks.set(t.week, w);
    }
    return [...weeks.values()].sort((a, b) => (a.week < b.week ? 1 : -1));
  }
  function costText(w) {
    if (!w.hasKnown) return `unknown (${w.unknown})`;
    return w.unknown ? `${costLabel(w.known)} + ${w.unknown} unknown` : costLabel(w.known);
  }

  function costSection() {
    const weeks = weeklyCosts();
    const month = new Date().toISOString().slice(0, 7);
    const inMonth = weeks.filter(w => w.week.startsWith(month));
    const agg = { known: 0, hasKnown: false, unknown: 0 };
    inMonth.forEach(w => { agg.known += w.known; agg.hasKnown = agg.hasKnown || w.hasKnown; agg.unknown += w.unknown; });
    const monthText = inMonth.length ? costText(agg) : "$0.00";
    const id = "cost";
    const rows = pageSlice(id, weeks).map(w => `<div class="row" role="button" tabindex="0" data-act="week" data-week="${esc(w.week)}">
        <span class="lead">${icon("payments")}</span>
        <span class="mid"><span class="ttl">Week of ${esc(w.week)}</span>
          <span class="tags"><span>${esc(costText(w))}</span></span></span>
        <span class="verb">Details ${icon("arrow_forward")}</span></div>`).join("");
    return section("all", id, "Cost", String(weeks.length),
      (rows || `<div class="empty">No cost data yet.</div>`) + pager(id, weeks.length),
      `<span class="mono">${esc(monthText)} this month</span>`);
  }

  function domainsSection() {
    const rows = pageSlice("domains", domains).map(d => {
      const its = allItems().filter(x => x.full === d.full);
      const needs = its.filter(isReady).length, stalled = its.filter(x => x.stalled).length;
      const running = its.length - needs;
      return `<div class="row" role="button" tabindex="0" data-act="goto" data-repo="${esc(d.full)}">
        <span class="lead">${icon("folder")}</span>
        <span class="mid"><span class="ttl">${esc(d.repo)}</span>
          <span class="tags"><span>${needs} need you</span><span>${running} running</span><span>${stalled} stalled</span></span></span>
        <span class="verb">Go to ${icon("arrow_forward")}</span></div>`;
    }).join("");
    return section("all", "domains", "Domains", String(domains.length),
      (rows || `<div class="empty">No domains yet.</div>`) + pager("domains", domains.length));
  }

  // ---- Agents, workflows and history of a page ----
  const catalogs = {};       // full -> {agents, skills, workflows, description, url, private} | {error}
  const catBusy = new Set();
  const boxes = {};          // "full|agent" -> {text, files: [{name, content}], error, busy}
  const starts = {};         // prompt key -> {spec, labels, values, error, busy}
  const cardOpen = {};       // "full|agent" -> {about, sc: shortcut index | null}
  const soloOpen = new Set(); // repos whose "Runs on its own" group is expanded
  const hist = {};           // full -> {q, agent, sort}
  let notice = "";

  const isList = () => view.page === "hq" || view.page === "domain";
  const rerender = () => { if (isList()) renderList(); };
  const typing = () => !!(document.activeElement && document.activeElement.closest && document.activeElement.closest(".keepfocus"));
  const backTo = () => isList() ? listView() : view;
  const hintBar = t => `<div class="actions"><span class="hint">${t}</span></div>`;

  async function loadCatalog(full) {
    if (!full || catBusy.has(full)) return;
    catBusy.add(full);
    const first = !catalogs[full];
    try {
      const res = await fetch("/api/catalog?repo=" + encodeURIComponent(full));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      if (data.refusal) throw new Error(data.refusal.message);
      catalogs[full] = data;
    } catch (e) {
      if (!catalogs[full] || catalogs[full].error) catalogs[full] = { error: e.message };
    } finally {
      catBusy.delete(full);
      if (isList()) { if (!typing()) renderList(); }
      else if (first && view.repo === full && ["about", "agent", "workflow", "shortcut"].includes(view.page)) go(view);
    }
  }
  const ensureCatalog = full => { if (full && !catalogs[full] && !catBusy.has(full)) loadCatalog(full); };
  const agentOf = (full, id) => ((catalogs[full] || {}).agents || []).find(a => a.id === id);
  const workflowOf = (full, id) => ((catalogs[full] || {}).workflows || []).find(w => w.id === id);

  function catSection(group, id, title, full, items, render) {
    const cat = catalogs[full];
    if (!cat) return section(group, id, title, "…", `<div class="empty">Loading…</div>`);
    if (cat.error) return section(group, id, title, "!", `<div class="error">${esc(cat.error)}</div>`);
    const list = items(cat);
    return section(group, id, title, String(list.length),
      pageSlice(id, list).map(x => render(x, cat)).join("") + pager(id, list.length));
  }

  // -- Agents
  const scKey = (full, agent, i) => ["sc", full, agent, i].join("|");
  const wfKey = (full, name) => ["wf", full, name].join("|");

  function promptHtml(key) {
    const st = starts[key];
    if (!st) return "";
    const ok = st.labels.every((_, i) => (st.values[i] || "").trim());
    return `<div class="needs keepfocus">${st.labels.map((l, i) => `<label>${esc(l)}
        <input data-pv="${esc(key)}" data-pi="${i}" value="${esc(st.values[i] || "")}"></label>`).join("")}
      <button class="primary" data-act="pgo" data-key="${esc(key)}" ${ok && !st.busy ? "" : "disabled"}>▶ Start</button>
      ${st.error ? `<div class="berr">${esc(st.error)}</div>` : ""}</div>`;
  }

  function chipHtml(full, a, i) {
    const at = `data-repo="${esc(full)}" data-agent="${esc(a.id)}" data-i="${i}"`;
    return `<span class="chip"><button class="l" data-act="shortcut" ${at} title="About this shortcut">${esc(a.shortcuts[i].label)}</button><button class="r" data-act="scstart" ${at} title="Start">▶</button></span>`;
  }

  const fileIcon = f => /^image\//.test(f.type) ? "image" : /pdf/.test(f.type) || /\.pdf$/i.test(f.name) ? "picture_as_pdf"
    : /^text\//.test(f.type) || /\.(md|txt|docx?|csv|json)$/i.test(f.name) ? "description" : "draft";
  const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB";

  function askBox(full, a, cat) {
    const k = full + "|" + a.id, b = boxes[k] || { text: "", files: [] };
    const can = !!(b.text.trim() || b.files.length) && !b.busy;
    return `<div class="askbox keepfocus" ${cat.private ? `data-dropbox="${esc(k)}"` : ""}>
      ${b.files.length ? `<div class="chips">${b.files.map((f, i) => `<span class="fchip">${icon(fileIcon(f))}${esc(f.name)}
        <span class="sz">${fmtSize(f.size || 0)}</span>
        <button class="ghost" data-act="rmfile" data-box="${esc(k)}" data-i="${i}" title="Remove">×</button></span>`).join("")}</div>` : ""}
      <div class="askrow">
        ${cat.private ? `<button class="ghost" data-act="addfile" data-box="${esc(k)}" title="Attach files">${icon("attach_file")}</button>
          <input type="file" multiple hidden data-fileinput="${esc(k)}">` : ""}
        <textarea rows="1" data-box-text="${esc(k)}" placeholder="Ask ${esc(a.display_name)}…">${esc(b.text)}</textarea>
        <button class="send ${can ? "has" : ""}" data-act="send" data-box="${esc(k)}" ${can ? "" : "disabled"} title="Send">${icon("arrow_upward")}</button>
      </div>${b.error ? `<div class="berr">${esc(b.error)}</div>` : ""}</div>`;
  }

  const stateOf = (full, id) => cardOpen[full + "|" + id] ||= { about: false, sc: null };
  const detailsHtml = a => `<div class="cpanel"><table>
      <tr><td>Does</td><td>${esc(a.purpose || "not stated")}</td></tr>
      <tr><td>Takes</td><td>${a.inputs == null ? "not stated" : a.inputs.length ? esc(a.inputs.join(", ")) : "none"}</td></tr>
      <tr><td>Gives</td><td>${esc(a.output || "not stated")}</td></tr>
      <tr><td>File</td><td><code>${esc(a.file || `.claude/agents/${a.id}.md`)}</code></td></tr></table></div>`;
  const pillHtml = (full, a, i) => `<button class="pill ${stateOf(full, a.id).sc === i ? "on" : ""}" data-act="scpanel" data-repo="${esc(full)}" data-agent="${esc(a.id)}" data-i="${i}">▶ ${esc(a.shortcuts[i].label)}</button>`;
  function scPanelHtml(full, a, i) {
    const s = a.shortcuts[i];
    return `<div class="cpanel"><table>
      <tr><td>Does</td><td>${esc(s.ask || "")}</td></tr>
      <tr><td>Needs</td><td>${esc(s.needs || "nothing")}</td></tr></table>
      ${promptHtml(scKey(full, a.id, i))}</div>`
  }

  function agentCard(full, a, cat) {
    const st = stateOf(full, a.id);
    return `<div class="card" data-agent="${esc(a.id)}">
      <div class="card-h"><span class="itile">${icon(a.icon || "smart_toy")}</span><button class="ghost cname" data-act="cabout" data-repo="${esc(full)}" data-agent="${esc(a.id)}">${esc(a.display_name)}</button>${a.general ? `<span class="tag">General · from HQ</span>` : ""}</div>
      <div class="muted">${esc(a.purpose || "")}</div>
      ${st.about ? detailsHtml(a) : ""}
      ${a.shortcuts.length ? `<div class="chips">${a.shortcuts.map((_, i) => pillHtml(full, a, i)).join("")}</div>` : ""}
      ${st.sc != null && a.shortcuts[st.sc] ? scPanelHtml(full, a, st.sc) : ""}
      ${askBox(full, a, cat)}</div>`;
  }

  const soloTag = a => ((a.description || "").match(/stage:[a-z-]+/) || [])[0] || "runs on its own";
  function soloGroup(full, list) {
    if (!list.length) return "";
    const open = soloOpen.has(full);
    return `<button class="solo-h ${open ? "open" : ""}" data-act="solo" data-repo="${esc(full)}">${icon("chevron_right", "chev")}Runs on its own (${list.length})</button>`
      + (open ? list.map(a => `<div class="srow" role="button" tabindex="0" data-act="cabout" data-repo="${esc(full)}" data-agent="${esc(a.id)}">
          ${icon(a.icon || "smart_toy")}<span>${esc(a.display_name)}</span><span class="tag">${a.general ? "General · from HQ" : esc(soloTag(a))}</span></div>`
        + (stateOf(full, a.id).about ? detailsHtml(a) : "")).join("") : "");
  }

  function agentsSection(group, id, full) {
    const cat = catalogs[full];
    if (!cat) return section(group, id, "Agents", "…", `<div class="empty">Loading…</div>`);
    if (cat.error) return section(group, id, "Agents", "!", `<div class="error">${esc(cat.error)}</div>`);
    const solo = cat.agents.filter(a => a.inputs && a.inputs.length === 0);
    const cards = cat.agents.filter(a => !(a.inputs && a.inputs.length === 0));
    return section(group, id, "Agents", String(cat.agents.length),
      pageSlice(id, cards).map(a => agentCard(full, a, cat)).join("") + pager(id, cards.length) + soloGroup(full, solo));
  }

  const readFile = f => new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok({ name: f.name, size: f.size, type: f.type, content: String(r.result).split(",")[1] || "" });
    r.onerror = () => bad(r.error);
    r.readAsDataURL(f);
  });
  async function addFiles(k, files) {
    const b = boxes[k] ||= { text: "", files: [] };
    try { b.files.push(...await Promise.all([...files].map(readFile))); b.error = ""; }
    catch (e) { b.error = "Couldn't read that file."; }
    rerender();
  }

  function afterStart(message) {
    banner = message;
    if (isList()) renderList(); else go({ ...listView(), keepBanner: true });
    load(true);
  }
  async function sendBox(k) {
    const b = boxes[k];
    if (!b || b.busy || !(b.text.trim() || b.files.length)) return;
    const [full, agent] = k.split("|");
    b.busy = true; b.error = "";
    rerender();
    try {
      const { message } = await post("/api/ask", { repo: full, agent, text: b.text, files: b.files.map(({ name, content }) => ({ name, content })) });
      delete boxes[k];
      afterStart(message);
    } catch (e) { b.busy = false; b.error = e.message; rerender(); }
  }

  // -- Starting a shortcut or a workflow
  function labelsOf(spec) {
    if (spec.type === "sc") { const s = agentOf(spec.full, spec.agent).shortcuts[spec.i]; return s.needs ? [s.needs] : []; }
    return workflowOf(spec.full, spec.name).inputs.filter(i => i.required).map(i => i.name);
  }
  function launch(spec, values) {
    if (spec.type === "sc") {
      const s = agentOf(spec.full, spec.agent).shortcuts[spec.i];
      const text = s.needs ? `${s.ask}\n\nAnswers:\n- ${s.needs}: ${values[0].trim()}` : s.ask;
      return post("/api/ask", { repo: spec.full, agent: spec.agent, text, files: [] });
    }
    const req = workflowOf(spec.full, spec.name).inputs.filter(i => i.required);
    const text = req.length ? "No ask given — use your defaults.\n\nAnswers:\n"
      + req.map((inp, i) => `- ${inp.name}: ${values[i].trim()}`).join("\n") : "";
    return post("/api/flow/start", { repo: spec.full, workflow: spec.name, text });
  }
  function showError(msg) {
    if (isList()) { notice = msg; renderList(); }
    else { const n = document.getElementById("notice"); if (n) n.innerHTML = `<div class="error">${esc(msg)}</div>`; }
  }
  async function beginStart(spec) {
    const labels = labelsOf(spec);
    if (labels.length) {
      if (!isList()) return go({ page: "shortcut", repo: spec.full, id: spec.agent, idx: spec.i, scope: scopeFull(), from: view });
      const key = spec.type === "sc" ? scKey(spec.full, spec.agent, spec.i) : wfKey(spec.full, spec.name);
      if (starts[key]) delete starts[key]; else starts[key] = { spec, labels, values: [], error: "" };
      return renderList();
    }
    try { afterStart((await launch(spec, [])).message); } catch (e) { showError(e.message); }
  }
  async function promptGo(key) {
    const st = starts[key];
    if (!st || st.busy) return;
    st.busy = true; st.error = "";
    rerender();
    try {
      const { message } = await launch(st.spec, st.values);
      delete starts[key];
      if (st.spec.type === "sc") stateOf(st.spec.full, st.spec.agent).sc = null;
      afterStart(message);
    }
    catch (e) { st.busy = false; st.error = e.message; rerender(); }
  }
  // The ▶ Start bar of a detail page: one field per need, dim until all are filled.
  const startBar = (labels, hint) => `<div class="actions"><span class="hint">${hint}</span>
    ${labels.map((l, i) => `<input class="barin" data-bi="${i}" placeholder="${esc(l)}" aria-label="${esc(l)}">`).join("")}
    <button class="primary" id="startbtn" ${labels.length ? "disabled" : ""}>▶ Start</button></div>`;
  function wireStartBar(spec) {
    const inputs = [...document.querySelectorAll("#bar .barin")], btn = document.getElementById("startbtn");
    const sync = () => { btn.disabled = !inputs.every(i => i.value.trim()); };
    inputs.forEach(i => i.addEventListener("input", sync));
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try { afterStart((await launch(spec, inputs.map(i => i.value))).message); }
      catch (e) { showError(e.message); sync(); }
    });
  }

  // -- Workflows
  function workflowRow(full, w) {
    const at = `data-repo="${esc(full)}" data-wf="${esc(w.id)}"`;
    return `<div class="wrow"><div class="split">
        <button class="half l" data-act="workflow" ${at}>${icon("account_tree")}<span class="mid"><span class="ttl">${esc(w.name)}</span>
          <span class="muted">${esc(w.purpose)}</span></span><span class="verb">Details</span></button>
        ${w.can_start ? `<button class="half r" data-act="wfstart" ${at} title="Start">▶ Start</button>` : ""}</div>
      ${w.error ? `<div class="empty werr">Can't run: ${esc(w.error)}</div>` : ""}${promptHtml(wfKey(full, w.id))}</div>`;
  }
  function workflowsSection(group, id, full) {
    const cat = catalogs[full];
    if (cat && !cat.error && !cat.workflows.length)
      return section(group, id, "Workflows", "0", `<div class="empty">No workflows here yet.</div>`);
    return catSection(group, id, "Workflows", full, c => c.workflows, w => workflowRow(full, w));
  }

  function skillRow(s) {
    const tags = (s.replaces ? `<span class="tag">Replaces HQ's ${esc(s.id)}</span>` : "")
      + (s.hq_only ? `<span class="tag">HQ only</span>` : "");
    return `<div class="row">${icon("bolt")}<span>${esc(s.name)}</span><span class="muted">${esc(s.description)}</span>${tags}</div>`;
  }
  function skillsSection(group, id, full) {
    const cat = catalogs[full];
    if (cat && !cat.error && !cat.skills.length)
      return section(group, id, "Skills", "0", `<div class="empty">No skills.</div>`);
    return catSection(group, id, "Skills", full, c => c.skills, skillRow);
  }

  // -- History
  const histState = full => hist[full] ||= { q: "", agent: "", sort: "newest" };
  function histItems(d) {
    const one = (kind, x, who, ask, failed) => ({ kind, full: d.full, repo: d.repo, number: x.number, title: x.title,
      created_at: x.created_at, who, ask, failed });
    return (d.runs || []).filter(r => r.state === "history").map(r => one("run", r, r.agent, r.ask, r.failed))
      .concat((d.flows || []).filter(f => f.state === "history").map(f => one("flow", f, f.workflow, "", false)));
  }
  function histShown(full) {
    const d = domains.find(x => x.full === full) || {}, st = histState(full), q = st.q.trim().toLowerCase();
    const all = histItems(d);
    let out = all.filter(x => (!st.agent || x.who === st.agent)
      && (!q || [x.title, x.ask, x.who].some(t => (t || "").toLowerCase().includes(q))));
    const newest = (a, b) => (a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : 0);
    out.sort(st.sort === "oldest" ? (a, b) => -newest(a, b)
      : st.sort === "agent" ? (a, b) => a.who.localeCompare(b.who) || newest(a, b) : newest);
    return { all, out };
  }
  function histRows(full, id) {
    const { out } = histShown(full);
    const rows = pageSlice(id, out).map(x => `<div class="row" role="button" tabindex="0" data-act="${x.kind}item" data-repo="${esc(full)}" data-number="${x.number}">
        <span class="lead">${icon(x.failed ? "error" : x.kind === "run" ? "description" : "account_tree")}</span>
        <span class="mid"><span class="ttl">${esc(x.title)}</span><span class="tags"><span>${esc(x.repo)}#${x.number}</span>
          <span class="tag">${esc(x.who)}</span><span>${esc(x.created_at.slice(0, 10))}</span></span></span>
        <span class="verb">Open ${icon("arrow_forward")}</span></div>`).join("");
    return (rows || `<div class="empty">Nothing here yet.</div>`) + pager(id, out.length);
  }
  const histId = full => (full === hqFull() ? "o-history" : "d-history");
  function historySection(group, id, full) {
    const st = histState(full), { all, out } = histShown(full);
    const who = [...new Set(all.map(x => x.who))].sort();
    const panel = `<div class="viewpanel keepfocus">
      <input type="search" placeholder="Search" aria-label="Search history" data-hq="q" data-full="${esc(full)}" value="${esc(st.q)}">
      <label>Agent <select data-hagent data-full="${esc(full)}"><option value="">All</option>${who.map(w =>
        `<option ${st.agent === w ? "selected" : ""}>${esc(w)}</option>`).join("")}</select></label>
      <label>Sort <select data-hsort data-full="${esc(full)}">${["newest", "oldest", "agent"].map(o =>
        `<option ${st.sort === o ? "selected" : ""}>${o}</option>`).join("")}</select></label></div>`;
    const filtered = out.length !== all.length;
    return section(group, id, "History", filtered ? `${out.length} of ${all.length}` : String(all.length),
      `${panel}<div class="hist-list">${histRows(full, id)}</div>`);
  }
  function refreshHistory(full) {
    const id = histId(full);
    pageIdx[id] = 0;
    const sec = pageEl.querySelector(`.sec[data-id="${id}"]`);
    if (!sec) return;
    const { all, out } = histShown(full);
    sec.querySelector(".hist-list").innerHTML = histRows(full, id);
    sec.querySelector(".count").textContent = out.length !== all.length ? `${out.length} of ${all.length}` : String(all.length);
  }

  // -- Run result and workflow item pages
  async function openRunResult() {
    const me = view;
    current = { repo: me.repo, number: me.number };
    frame("Agent run", "smart_toy", `${short(me.repo)}#${me.number}`, metaLine(me.repo, me.number),
      `<div class="spinner">Reading the run…</div>`, hintBar("Nothing here needs a decision."));
    try {
      const r = await post("/api/run/read", current);
      if (view !== me) return;
      const open = r.pr?.state === "OPEN";
      frame("Agent run", r.failed ? "error" : "smart_toy", r.title, metaLine(me.repo, me.number, { url: r.url, label: "Issue" }) + ` · ${esc(r.agent)}`,
        dsec("ask", "Ask", lines(r.ask), `<pre>${esc(r.ask)}</pre>`) +
        (r.finished ? dsec("result", r.failed ? "Why it failed" : "Result", lines(r.result), blocks(r.result))
          : dsec("status", "Status", 1, `<p>Still running — the result shows up here when it finishes.</p>`)) +
        (r.pr ? dsec("pr", "Pull request", r.pr.files.length,
          `<p><a href="${esc(r.pr.url)}" target="_blank" rel="noopener">#${r.pr.number}</a> · ${esc(r.pr.state.toLowerCase())}</p>` +
          `<ul>${r.pr.files.map(f => `<li><code>${esc(f)}</code></li>`).join("")}</ul>`) : ""),
        open ? `<div class="actions"><span class="hint" id="hint"></span><button id="discard">Discard</button><button class="primary" id="merge">Merge</button></div>`
          : hintBar("Nothing here needs a decision."));
      if (open) {
        armed(document.getElementById("discard"), "Click again to discard", () => send("/api/run/discard", {}, "Discarding…"));
        armed(document.getElementById("merge"), "Click again to merge", () => send("/api/run/merge", {}, "Merging…"));
      }
      if (r.finished) load(true);
    } catch (e) {
      if (view !== me) return;
      document.getElementById("notice").innerHTML = `<div class="error">${esc(e.message)}</div>`;
      pageEl.querySelector(".spinner")?.remove();
    }
  }

  function renderFlowItem() {
    const me = view, d = domains.find(x => x.full === me.repo) || {};
    const f = (d.flows || []).find(x => x.number === me.number);
    if (!f) {
      return frame("Workflow item", "account_tree", `${short(me.repo)}#${me.number}`, metaLine(me.repo, me.number),
        `<div class="empty">This item isn't listed any more.</div>`, hintBar("Nothing here needs a decision."));
    }
    const where = f.state === "history" ? "Finished" : f.gate ? "Waiting at a gate" : f.waiting.includes("waiting:user") ? "Waiting for you" : "An agent is working";
    frame("Workflow item", "account_tree", f.title, metaLine(me.repo, f.number, { url: f.url, label: "Issue" }),
      dsec("where", "Where it is", 1, `<table><tr><td class="k">Workflow</td><td>${esc(f.workflow)}</td></tr>

      (f.gate ? dsec("question", "The question", 1, `<p>${esc(f.question)}</p>`) : ""),
      hintBar(f.state === "ready" ? `Decide it with /review ${esc(d.repo)}#${f.number}` : "Nothing here needs a decision."));

  // -- About pages
  const aboutRow = (act, at, ic, title, sub) => `<div class="row" role="button" tabindex="0" data-act="${act}" ${at}>
    <span class="lead">${icon(ic)}</span><span class="mid"><span class="ttl">${esc(title)}</span>
    <span class="tags"><span>${esc(sub || "")}</span></span></span><span class="verb">Details ${icon("arrow_forward")}</span></div>`;
  function aboutLists(full) {
    const cat = catalogs[full];
    if (!cat) { ensureCatalog(full); return dsec("agents", "Agents", "…", `<div class="empty">Loading…</div>`); }

        aboutRow("agent", `data-repo="${esc(full)}" data-agent="${esc(a.id)}"`, a.icon || "smart_toy", a.display_name, a.general ? "General · from HQ — " + a.purpose : a.purpose)).join("")

  function renderWorkflowAbout() {
    const full = view.repo, w = workflowOf(full, view.id);

  // ---- Page shell ----
  const scopeFull = () => view.scope === undefined ? (view.page === "domain" ? view.repo : null) : view.scope;
  function scopeName() {
    const s = scopeFull();
    return s ? short(s) : "HQ";
  }
  const scopeIsHq = () => { const s = scopeFull(); return !s || s === hqFull(); };
  const listView = () => { const s = scopeFull(); return s && s !== hqFull() ? { page: "domain", repo: s } : { page: "hq" }; };

  function renderTop() {
    const s = scopeFull() || hqFull();
    const others = allItems().filter(x => isReady(x) && x.full !== s).length;
    const opts = [`<div class="opt ${scopeIsHq() ? "current" : ""}" role="button" tabindex="0" data-act="goto" data-repo="">${icon("home")} HQ

    const show = isList();

    updateSys();

  // ---- Navigation ----
  function go(v) {
    if (view.page === "review" && current) {  // leaving a review: put the user's copy back
      clearInterval(pingTimer);
      post("/api/review/close", current).catch(() => {});
    }
    view = v;
    banner = v.keepBanner ? banner : "";
    notice = "";
    dropOpen = false;
    if (v.page === "hq" || v.page === "domain") {
      current = null; renderList(); loadCatalog(v.page === "domain" ? v.repo : hqFull());
    }
    else if (v.page === "about") renderAbout();
    else if (v.page === "review") openReview();
    else if (v.page === "answer") openAnswer();
    else if (v.page === "run") renderRun();
    else if (v.page === "result") renderResult();
    else if (v.page === "runitem") openRunResult();
    else if (v.page === "flowitem") renderFlowItem();
    else if (v.page === "agent") renderAgentAbout();
    else if (v.page === "workflow") renderWorkflowAbout();
    else if (v.page === "shortcut") renderShortcutAbout();
    window.scrollTo(0, 0);
  }
