# Work Item stub. Installed into each domain repo as .github/workflows/work-item.yml
# by scripts/enable-agents.sh, which fills in __HQ_REPO__ and __REF__.
# It hands stage: labels to HQ's runner, and also releases waiting:work Work Items
# (any repo) the moment one of this repo's Issues closes as merged — see
# scripts/runner/release-blocked.sh, which is all the logic lives in.
# An owner's reply on a `run` Issue (issue_comment) runs the same agent again with the
# whole thread — see scripts/runner/run-reply.sh.
# A manual run (workflow_dispatch: agent + ask) starts a named agent on a one-off
# task, outside the lifecycle — see scripts/runner/run-*.sh. Workflow stages
# (orchestration/workflows.md) start each other the same way, by dispatch, so the token
# needs `actions: write`: domains (HQ included) must re-run scripts/enable-agents.sh
# to get it.
name: Work Item

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      agent:
        description: Name of the agent to run (a .claude/agents/<name>.md)
        required: true
        type: string
      ask:
        description: The task to give it
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id) || format('work-item-{0}', github.event.issue.number || github.run_id) }}
  cancel-in-progress: false

# The most the runner's jobs may use; each job asks for what it needs.
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  run:
    if: github.event.action == 'labeled'
    uses: __HQ_REPO__/.github/workflows/work-item-runner.yml@__REF__
    with:
      hq_repo: __HQ_REPO__
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  release:
    if: github.event.action == 'closed' && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    concurrency:
      group: hq-release-blocked
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - run: git clone --depth 1 https://github.com/__HQ_REPO__.git .hq
      - run: bash .hq/scripts/runner/release-blocked.sh
        env:
          GH_TOKEN: ${{ secrets.HQ_RELEASE_TOKEN }}

  ask:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch HQ
        run: git clone --depth 1 https://github.com/__HQ_REPO__.git .hq

      - name: Open the run Issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT: ${{ inputs.agent }}
          ASK: ${{ inputs.ask }}
        run: bash .hq/scripts/runner/run-open.sh

      - name: Install HQ's agents
        run: bash .hq/scripts/runner/install-agents.sh

      - name: The agent's briefing
        id: prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.issue.outputs.num }}
          AGENT: ${{ inputs.agent }}
          ASK: ${{ inputs.ask }}
        run: bash .hq/scripts/runner/run-prompt.sh

      - name: The agent's flags
        id: flags
        env:
          NAME: ${{ inputs.agent }}
          MAX_TURNS: 80
          DEFAULT_MODEL: sonnet
          DEFAULT_EFFORT: medium
        run: bash .hq/scripts/runner/claude-args.sh

      - uses: anthropics/claude-code-action@v1
        id: run_agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude,github-actions"
          claude_args: ${{ steps.flags.outputs.args }}
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Post the agent's result
        if: steps.run_agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.issue.outputs.num }}
          EXECUTION_FILE: ${{ steps.run_agent.outputs.execution_file }}
        run: bash .hq/scripts/runner/run-result.sh

      - name: Open a PR for any file changes
        if: steps.run_agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.issue.outputs.num }}
          AGENT: ${{ inputs.agent }}
        run: bash .hq/scripts/runner/run-pr.sh

      - name: Report a failed agent run
        if: failure() && steps.issue.outputs.num != '' && steps.prompt.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.issue.outputs.num }}
          AGENT: ${{ inputs.agent }}
        run: bash .hq/scripts/runner/run-failed.sh

  reply:
    if: >-
      github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && contains(github.event.issue.labels.*.name, 'run')
      && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    concurrency:
      group: run-reply-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch HQ
        run: git clone --depth 1 https://github.com/__HQ_REPO__.git .hq

      - name: Take the reply
        id: take
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .hq/scripts/runner/run-reply.sh

      - name: Install HQ's agents
        if: steps.take.outputs.go == 'true'
        run: bash .hq/scripts/runner/install-agents.sh

      - name: The agent's briefing
        if: steps.take.outputs.go == 'true'
        id: prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.take.outputs.num }}
          AGENT: ${{ steps.take.outputs.agent }}
        run: bash .hq/scripts/runner/run-reply-prompt.sh

      - name: The agent's flags
        if: steps.take.outputs.go == 'true'
        id: flags
        env:
          NAME: ${{ steps.take.outputs.agent }}
          MAX_TURNS: 80
          DEFAULT_MODEL: sonnet
          DEFAULT_EFFORT: medium
        run: bash .hq/scripts/runner/claude-args.sh

      - uses: anthropics/claude-code-action@v1
        if: steps.take.outputs.go == 'true'
        id: run_agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ steps.flags.outputs.args }}
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Post the agent's result
        if: steps.take.outputs.go == 'true' && steps.run_agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.take.outputs.num }}
          EXECUTION_FILE: ${{ steps.run_agent.outputs.execution_file }}
        run: bash .hq/scripts/runner/run-result.sh

      - name: Open a PR for any file changes
        if: steps.take.outputs.go == 'true' && steps.run_agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.take.outputs.num }}
          AGENT: ${{ steps.take.outputs.agent }}
        run: bash .hq/scripts/runner/run-pr.sh

      - name: Report a failed agent run
        if: failure() && steps.take.outputs.go == 'true' && steps.prompt.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.take.outputs.num }}
          AGENT: ${{ steps.take.outputs.agent }}
        run: bash .hq/scripts/runner/run-failed.sh
